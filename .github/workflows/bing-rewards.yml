name: Bing Rewards Daily

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  schedule:
    # 北京时间每天 00:10 (UTC 16:10)
    - cron: '10 16 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    defaults:
      run:
        working-directory: sources/bing-rewards

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          pip install httpx playwright requests

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Bing Rewards
        env:
          USE_HEADED: "true"
          BING_ACCOUNTS: ${{ secrets.BING_ACCOUNTS }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python bing_rewards.py

  keepalive:
    name: Keepalive
    if: ${{ always() }}
    needs: run
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
