name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Extension pack checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Secret scan
        run: python3 scripts/ci-secret-scan.py

      - name: Python syntax check
        run: python3 scripts/ci-python-compile.py

      - name: Rust crate tests
        run: bash scripts/ci-rust-crates.sh